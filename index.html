<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thailand Fun Trip!</title>
    
    <!-- 1. Tailwind CSS for making it pretty -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React and ReactDOM (The Engine) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Babel (The Translator) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 4. Lucide Icons (The Pictures) - Fixed Version -->
    <script src="https://unpkg.com/lucide-react@0.468.0/dist/umd/lucide-react.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #F0F4F8; }
        .selection-yellow ::selection { background-color: #FEF08A; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Get tools from the global window objects
        const { useState } = React;
        
        // Safety check for icons
        const icons = window.lucideReact || {};
        const { 
            Plane, MapPin, Sun, Moon, Camera, ShoppingBag, Music, Anchor, 
            Users, Clock, CreditCard, Info, Palmtree, Waves, Star, Heart, 
            Utensils, CheckCircle, XCircle, Smile, Zap 
        } = icons;

        // Fallback Icon component in case load fails
        const IconFallback = ({ name }) => <span className="text-xs font-bold p-1 border rounded">{name}</span>;

        // --- COMPONENTS START HERE ---

        // A fun, big card component for each day
        const StoryCard = ({ day, title, location, description, icons, color, image, highlight }) => {
            return (
                <div className="mb-12 relative transform hover:scale-[1.02] transition-transform duration-300">
                    {/* The Day Badge - Big and circular */}
                    <div className={`absolute -top-6 -left-4 z-20 w-20 h-20 rounded-full ${color.bg} border-4 border-white shadow-xl flex flex-col items-center justify-center text-white`}>
                        <span className="text-xs font-bold uppercase tracking-wider">Day</span>
                        <span className="text-4xl font-extrabold leading-none">{day}</span>
                    </div>

                    <div className="bg-white rounded-[2rem] overflow-hidden shadow-2xl border-b-8 border-r-8 border-gray-200">
                        
                        {/* Giant Image Area */}
                        <div className="relative h-72 md:h-96 w-full bg-gray-200">
                            <img 
                                src={image} 
                                alt={title}
                                className="w-full h-full object-cover"
                            />
                            <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent p-6 pt-24">
                                <h3 className="text-3xl md:text-4xl font-black text-white mb-2 drop-shadow-md leading-tight">
                                    {title}
                                </h3>
                                <div className="flex items-center text-yellow-300 font-bold text-lg">
                                    {MapPin ? <MapPin className="mr-2" fill="currentColor" /> : <span>📍</span>}
                                    {location}
                                </div>
                            </div>
                        </div>

                        {/* Content Area - Big text, easy to read */}
                        <div className="p-8">
                            
                            {/* Fun Highlight Pill */}
                            <div className={`inline-block px-4 py-2 rounded-full ${color.light} ${color.text} font-bold text-sm mb-4 uppercase tracking-wide flex items-center`}>
                                {Star ? <Star size={16} className="mr-2 fill-current" /> : <span>⭐</span>}
                                Fun Part: {highlight}
                            </div>

                            <p className="text-2xl text-gray-700 font-medium leading-relaxed mb-8">
                                {description}
                            </p>

                            {/* Activity Icons - Huge and labeled */}
                            <div className="grid grid-cols-3 gap-4">
                                {icons.map((item, idx) => (
                                    <div key={idx} className="flex flex-col items-center justify-center p-4 bg-gray-50 rounded-2xl border-2 border-gray-100">
                                        {item.icon ? <item.icon size={32} className={`mb-2 ${color.text}`} /> : <IconFallback name={item.label} />}
                                        <span className="text-xs font-bold text-gray-400 uppercase text-center">{item.label}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Big Bubble Stat Card
        const BubbleStat = ({ icon: Icon, label, value, color }) => (
            <div className={`flex flex-col items-center justify-center p-6 rounded-[2rem] ${color} text-center shadow-lg transform hover:-translate-y-1 transition-transform`}>
                <div className="bg-white/90 p-4 rounded-full mb-3 shadow-sm">
                    {Icon ? <Icon size={32} className="text-gray-800" /> : <span>ℹ️</span>}
                </div>
                <p className="text-white text-sm font-bold uppercase opacity-80 mb-1">{label}</p>
                <p className="text-white text-2xl font-black">{value}</p>
            </div>
        );

        // Visual List Item for inclusions
        const VisualItem = ({ type, text, icon: Icon }) => (
            <div className={`flex items-center p-4 rounded-2xl border-2 ${type === 'yes' ? 'border-green-100 bg-green-50' : 'border-red-100 bg-red-50'}`}>
                <div className={`w-12 h-12 rounded-full flex items-center justify-center mr-4 shrink-0 ${type === 'yes' ? 'bg-green-500' : 'bg-red-500'} text-white shadow-md`}>
                    {type === 'yes' ? (CheckCircle ? <CheckCircle size={24} /> : <span>✓</span>) : (XCircle ? <XCircle size={24} /> : <span>✕</span>)}
                </div>
                <div>
                    <h4 className={`font-bold text-lg ${type === 'yes' ? 'text-green-800' : 'text-red-800'}`}>{text}</h4>
                    <div className="flex items-center text-gray-500 text-sm mt-1">
                        {Icon ? <Icon size={14} className="mr-1" /> : <span>•</span>}
                        <span>{type === 'yes' ? 'Included!' : 'You pay extra'}</span>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [view, setView] = useState('trip'); // 'trip' or 'details'

            const days = [
                {
                    day: 1,
                    title: "Hello Beach!",
                    location: "Krabi",
                    highlight: "Amazing Sunset",
                    description: "Fly to Krabi! See big cliffs and blue water. Watch the sun go down while sitting on the soft sand.",
                    color: { bg: "bg-teal-500", text: "text-teal-600", light: "bg-teal-100" },
                    image: "https://commons.wikimedia.org/wiki/Special:FilePath/Ao_Nang_beach_panorama_1.jpg",
                    icons: [
                        { icon: Plane, label: "Fly" },
                        { icon: Sun, label: "Sunset" },
                        { icon: Palmtree, label: "Relax" }
                    ]
                },
                {
                    day: 2,
                    title: "Island Hopping",
                    location: "Krabi -> Phuket",
                    highlight: "Chicken Island",
                    description: "Ride a fast boat to 4 tiny islands! One looks like a Chicken head! Swim in clear water. Then take a big boat to Phuket.",
                    color: { bg: "bg-cyan-500", text: "text-cyan-600", light: "bg-cyan-100" },
                    image: "https://commons.wikimedia.org/wiki/Special:FilePath/Ao_Nang_Beach.jpg",
                    icons: [
                        { icon: Anchor, label: "Boat" },
                        { icon: Waves, label: "Swim" },
                        { icon: Camera, label: "Photos" }
                    ]
                },
                {
                    day: 3,
                    title: "James Bond Rock",
                    location: "Phuket",
                    highlight: "Movie Star Island",
                    description: "See the famous rock from the 007 movie! It sticks straight out of the green water. At night, see a huge show with elephants!",
                    color: { bg: "bg-blue-600", text: "text-blue-600", light: "bg-blue-100" },
                    image: "https://commons.wikimedia.org/wiki/Special:FilePath/Khao_Phing_Kan_(14974551496).jpg",
                    icons: [
                        { icon: Star, label: "Famous" },
                        { icon: Music, label: "Show" },
                        { icon: Utensils, label: "Food" }
                    ]
                },
                {
                    day: 4,
                    title: "City Lights",
                    location: "Bangkok -> Pattaya",
                    highlight: "Alcazar Show",
                    description: "Fly to the big city, then drive to the beach city! Watch a sparkly dance show with amazing costumes and feathers.",
                    color: { bg: "bg-pink-500", text: "text-pink-600", light: "bg-pink-100" },
                    image: "https://commons.wikimedia.org/wiki/Special:FilePath/Alkazar_show1.jpg",
                    icons: [
                        { icon: Plane, label: "Fly" },
                        { icon: Music, label: "Dance" },
                        { icon: Users, label: "Fun" }
                    ]
                },
                {
                    day: 5,
                    title: "Fast Boats & Gardens",
                    location: "Pattaya",
                    highlight: "Speedboat Ride",
                    description: "Zoom over the waves on a speedboat! Visit a beautiful garden with dinosaurs and funny shaped bushes.",
                    color: { bg: "bg-orange-500", text: "text-orange-600", light: "bg-orange-100" },
                    image: "https://commons.wikimedia.org/wiki/Special:FilePath/Nong_Nooch.jpg",
                    icons: [
                        { icon: Zap, label: "Fast" },
                        { icon: Palmtree, label: "Garden" },
                        { icon: Smile, label: "Happy" }
                    ]
                },
                {
                    day: 6,
                    title: "Shopping Time",
                    location: "Bangkok",
                    highlight: "Gems Gallery",
                    description: "Go up a tall tower to see the view! Then go shopping for cool clothes and see shiny jewels at a gallery.",
                    color: { bg: "bg-purple-500", text: "text-purple-600", light: "bg-purple-100" },
                    image: "https://commons.wikimedia.org/wiki/Special:FilePath/Pattaya_Park_Tower.jpg",
                    icons: [
                        { icon: ShoppingBag, label: "Shop" },
                        { icon: Camera, label: "View" },
                        { icon: MapPin, label: "City" }
                    ]
                },
                {
                    day: 7,
                    title: "Zoo & Dinner Cruise",
                    location: "Bangkok",
                    highlight: "Giraffes!",
                    description: "Visit the Safari! See giraffes, zebras, and dolphins. At night, eat dinner on a boat while looking at glowing temples.",
                    color: { bg: "bg-red-500", text: "text-red-600", light: "bg-red-100" },
                    image: "https://commons.wikimedia.org/wiki/Special:FilePath/Chao-phraya-river-cruise.jpg",
                    icons: [
                        { icon: Camera, label: "Animals" },
                        { icon: Heart, label: "Love" },
                        { icon: Utensils, label: "Dinner" }
                    ]
                },
                {
                    day: 8,
                    title: "Big Gold Buddha",
                    location: "Home Time",
                    highlight: "Wat Pho",
                    description: "See a HUGE gold statue of Buddha lying down. It is very peaceful. Then, it is time to fly back home!",
                    color: { bg: "bg-yellow-500", text: "text-yellow-600", light: "bg-yellow-100" },
                    image: "https://commons.wikimedia.org/wiki/Special:FilePath/Reclining_Buddha,_Wat_Pho,_Bangkok_a063.jpg",
                    icons: [
                        { icon: Star, label: "Gold" },
                        { icon: Info, label: "Culture" },
                        { icon: Plane, label: "Home" }
                    ]
                }
            ];

            return (
                <div className="min-h-screen bg-[#F0F4F8] selection-yellow">
                    
                    {/* Fun Top Bar */}
                    <div className="bg-white p-4 shadow-sm sticky top-0 z-50">
                        <div className="max-w-xl mx-auto flex gap-2 p-1 bg-gray-100 rounded-full">
                            <button 
                                onClick={() => setView('trip')}
                                className={`flex-1 py-3 px-6 rounded-full font-bold text-lg transition-all ${view === 'trip' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-gray-600'}`}
                            >
                                🏝️ The Trip
                            </button>
                            <button 
                                onClick={() => setView('details')}
                                className={`flex-1 py-3 px-6 rounded-full font-bold text-lg transition-all ${view === 'details' ? 'bg-green-600 text-white shadow-md' : 'text-gray-400 hover:text-gray-600'}`}
                            >
                                💰 The Deal
                            </button>
                        </div>
                    </div>

                    <div className="max-w-2xl mx-auto px-6 py-8">
                        
                        {view === 'trip' && (
                            <>
                                {/* Big Hero Title */}
                                <div className="text-center mb-10">
                                    <h1 className="text-5xl font-black text-blue-900 mb-2 tracking-tight">Thailand Fun!</h1>
                                    <p className="text-xl text-blue-600 font-medium">8 Days of Sun, Sea & Smiles</p>
                                </div>

                                {/* Stats Bubbles */}
                                <div className="grid grid-cols-2 gap-4 mb-12">
                                    <BubbleStat icon={Clock} label="How Long?" value="8 Days" color="bg-blue-500" />
                                    <BubbleStat icon={CreditCard} label="Price" value="₹1.32L" color="bg-green-500" />
                                </div>

                                {/* The Story Cards */}
                                <div className="pl-4"> {/* Left padding for the timeline feel */}
                                    {days.map((day) => (
                                        <StoryCard key={day.day} {...day} />
                                    ))}
                                </div>

                                <div className="text-center mt-12 mb-24">
                                    <div className="inline-block bg-yellow-400 p-6 rounded-full shadow-xl animate-bounce">
                                        <p className="text-2xl font-black text-yellow-900">Sounds Good?</p>
                                    </div>
                                </div>
                            </>
                        )}

                        {view === 'details' && (
                            <div className="space-y-8">
                                <div className="text-center mb-10">
                                    <h1 className="text-4xl font-black text-green-900 mb-2">What Do You Get?</h1>
                                    <p className="text-xl text-green-600 font-medium">Included vs. Not Included</p>
                                </div>

                                <div className="bg-white rounded-[2rem] p-8 shadow-xl">
                                    <h2 className="text-2xl font-black text-green-600 mb-6 flex items-center">
                                        {CheckCircle ? <CheckCircle className="mr-3" size={32} /> : <span>✓</span>} YES! Included
                                    </h2>
                                    <div className="space-y-4">
                                        <VisualItem type="yes" text="Flights" icon={Plane} />
                                        <VisualItem type="yes" text="Hotels" icon={Moon} />
                                        <VisualItem type="yes" text="Breakfast, Lunch, Dinner" icon={Utensils} />
                                        <VisualItem type="yes" text="All Entry Tickets" icon={Star} />
                                        <VisualItem type="yes" text="Tour Guide" icon={Users} />
                                        <VisualItem type="yes" text="Visa Fees" icon={Info} />
                                    </div>
                                </div>

                                <div className="bg-white rounded-[2rem] p-8 shadow-xl border-t-8 border-red-100">
                                    <h2 className="text-2xl font-black text-red-500 mb-6 flex items-center">
                                        {XCircle ? <XCircle className="mr-3" size={32} /> : <span>✕</span>} NO! Not Included
                                    </h2>
                                    <div className="space-y-4">
                                        <VisualItem type="no" text="Personal Shopping" icon={ShoppingBag} />
                                        <VisualItem type="no" text="Laundry" icon={Waves} />
                                        <VisualItem type="no" text="Extra Water Sports" icon={Zap} />
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
